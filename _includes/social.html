<h6>Follow me</h6>
<ul class="social-media">
  {% if site.social.github %}
    <li>
      <a title="{{ site.social.github }} on Github" href="https://github.com/Var-al" target="_blank">
        <i class="fab fa-github fa-2x"></i>
      </a>
    </li>
  {% endif %}

  <li>
    <a title="微信" href="javascript:void(0);" class="modal-trigger" data-target="wechat-modal">
      <i class="fab fa-weixin fa-2x"></i>
    </a>
  </li>

  <li>
    <a title="网易云音乐" href="javascript:void(0);" class="modal-trigger" data-target="music-modal">
      <i class="fas fa-music fa-2x"></i>
    </a>
  </li>
</ul>

<div id="wechat-modal" class="simple-modal">
  <div class="modal-content">
    <a href="javascript:void(0);" class="close-btn">&times;</a>
    <h3>微信二维码</h3>
    <img src="/assets/images/wechat.png" alt="微信二维码">
    <p>扫码添加微信，备注"Veyne"</p>
  </div>
</div>

<div id="music-modal" class="simple-modal">
  <div class="modal-content">
    <a href="javascript:void(0);" class="close-btn">&times;</a>
    <h3>网易云音乐</h3>
    <img src="/assets/images/wyy.jpg" alt="网易云二维码">
    <p>扫码关注我的网易云音乐</p>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 统一打开弹窗的逻辑
    document.querySelectorAll('.modal-trigger').forEach(function(trigger) {
        trigger.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            var modalId = this.getAttribute('data-target');
            var modal = document.getElementById(modalId);
            if (modal) {
                modal.style.display = 'block';
            }
        });
    });

    // 统一关闭逻辑 (关闭按钮)
    document.querySelectorAll('.close-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            this.closest('.simple-modal').style.display = 'none';
        });
    });

    // 点击弹窗背景关闭
    window.addEventListener('click', function(e) {
        if (e.target.classList.contains('simple-modal')) {
            e.target.style.display = 'none';
        }
    });

    // 按下 ESC 键关闭所有弹窗
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            document.querySelectorAll('.simple-modal').forEach(function(m) {
                m.style.display = 'none';
            });
        }
    });
});
</script>

<style>
/* 弹窗基础样式 */
.simple-modal {
    display: none; 
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8); 
    z-index: 9999; 
}

/* 弹窗内容卡片 */
.modal-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    max-width: 320px;
    width: 90%;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
}

/* 关闭按钮样式 */
.close-btn {
    position: absolute;
    right: 15px;
    top: 10px;
    font-size: 28px;
    font-weight: bold;
    color: #333;
    text-decoration: none;
    cursor: pointer;
    line-height: 1;
}

.close-btn:hover {
    color: #000;
}

/* 图片适配 */
.modal-content img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 15px auto;
    border-radius: 5px;
    border: 1px solid #eee;
}

.modal-content h3 {
    margin: 0 0 15px 0;
    color: #333;
    font-size: 1.5em;
}

.modal-content p {
    color: #666;
    margin: 10px 0 0 0;
    font-size: 0.9em;
}

/* 暗色主题适配 */
body.dark-theme .modal-content {
    background: #2d2d2d;
    color: #e0e0e0;
}

body.dark-theme .close-btn, body.dark-theme .modal-content h3 {
    color: #e0e0e0;
}

body.dark-theme .modal-content p {
    color: #bbb;
}

body.dark-theme .modal-content img {
    border-color: #555;
}
</style>
